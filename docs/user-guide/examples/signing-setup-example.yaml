# Complete example for setting up signing in Galaxy
# This file contains all the resources needed for collection and container signing

---
# 1. Signing Secret - Contains the GPG private key
apiVersion: v1
kind: Secret
metadata:
  name: signing-galaxy
  namespace: galaxy  # Replace with your namespace
stringData:
  signing_service.gpg: |
    -----BEGIN PGP PRIVATE KEY BLOCK-----
    
    # Replace this with your actual GPG private key
    # Generate with: gpg --armor --export-secret-keys YOUR_KEY_ID
    
    -----END PGP PRIVATE KEY BLOCK-----

---
# 2. Signing Scripts ConfigMap - Contains the signing scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: signing-scripts
  namespace: galaxy  # Replace with your namespace
data:
  collection_sign.sh: |
    #!/usr/bin/env bash
    
    FILE_PATH=$1
    SIGNATURE_PATH=$1.asc
    
    ADMIN_ID="$PULP_SIGNING_KEY_FINGERPRINT"
    PASSWORD=""  # Set your GPG key passphrase here, or leave empty for no passphrase
    
    # Create a detached signature
    gpg --quiet --batch --pinentry-mode loopback --yes --passphrase \
      $PASSWORD --homedir /var/lib/pulp/.gnupg --detach-sign --default-key $ADMIN_ID \
      --armor --output $SIGNATURE_PATH $FILE_PATH
    
    # Check the exit status
    STATUS=$?
    if [ $STATUS -eq 0 ]; then
      echo {\"file\": \"$FILE_PATH\", \"signature\": \"$SIGNATURE_PATH\"}
    else
      exit $STATUS
    fi
    
  container_sign.sh: |
    #!/usr/bin/env bash
    
    # galaxy_container SigningService will pass the next 4 variables to the script
    MANIFEST_PATH=$1
    FINGERPRINT="$PULP_SIGNING_KEY_FINGERPRINT"
    IMAGE_REFERENCE="$REFERENCE"
    SIGNATURE_PATH="$SIG_PATH"
    
    # Create container signature using skopeo
    skopeo standalone-sign \
      $MANIFEST_PATH \
      $IMAGE_REFERENCE \
      $FINGERPRINT \
      --output $SIGNATURE_PATH
    
    # Optionally pass the passphrase to the key if password protected
    # --passphrase-file /path/to/key_password.txt
    
    # Check the exit status
    STATUS=$?
    if [ $STATUS -eq 0 ]; then
      echo {\"signature_path\": \"$SIGNATURE_PATH\"}
    else
      exit $STATUS
    fi

---
# 3. Galaxy Custom Resource with signing configuration
apiVersion: galaxy.ansible.com/v1beta1
kind: Galaxy
metadata:
  name: example-galaxy
  namespace: galaxy  # Replace with your namespace
spec:
  # Basic configuration
  image: quay.io/ansible/galaxy-ng
  image_version: latest
  image_web: quay.io/ansible/galaxy-ui
  image_web_version: latest
  
  # Admin password secret (create this separately)
  admin_password_secret: "example-galaxy-admin-password"
  
  # Signing configuration - references the resources above
  signing_secret: "signing-galaxy"
  signing_scripts_configmap: "signing-scripts"
  
  # Storage configuration
  storage_type: File
  file_storage_size: "100Gi"
  file_storage_access_mode: "ReadWriteMany"
  
  # Ingress configuration
  ingress_type: Route  # or 'nodeport' for NodePort service
  
  # Optional: Pulp settings
  pulp_settings:
    allowed_export_paths:
      - /tmp
    allowed_import_paths:
      - /tmp
    telemetry: false
  
  # Optional: Resource requirements
  api:
    replicas: 1
    resource_requirements:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  
  content:
    replicas: 2
    resource_requirements:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  
  worker:
    replicas: 1
    resource_requirements:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

---
# 4. Admin password secret (example - generate a secure password)
apiVersion: v1
kind: Secret
metadata:
  name: example-galaxy-admin-password
  namespace: galaxy  # Replace with your namespace
stringData:
  password: "changeme123!"  # Replace with a secure password
